<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KG - LT Fiyat Hesaplama</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eef2f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:470px;
    background:#ffffff;
    border-radius:18px;
    padding:26px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.input-group{
    margin-bottom:18px;
    width:100%;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:700;
    color:#3d4f66;
}

.field-container{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
}

.field-container input{
    width:100%;
    min-width:0;
}

input{
    flex:1;
    height:46px;
    border:2px solid #bfc6cd;
    border-radius:8px;
    background:#fff;
    padding:0 14px;
    font-size:16px;
    text-align:center;
    transition:0.2s;
    -webkit-appearance:none;
    appearance:none;
}

input:focus{
    outline:none;
    border-color:#57c785;
}

.yellow-bg{
    background:#f7eb75 !important;
}

.clear-btn{
    width:40px;
    height:46px;
    background:#3498db;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    flex-shrink:0;
    touch-action:manipulation;
}

.clear-btn:hover{
    background:#2587ca;
}

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:8px;
    background:#2ecc71;
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
    transition:0.2s;
}

button:hover{
    background:#28b765;
}

.result{
    display:none;
    margin-top:20px;
    background:#ecfdf5;
    border-radius:10px;
    padding:18px;
}

.result p{
    margin:10px 0;
    color:#2c3e50;
    font-size:15px;
}

.highlight{
    float:right;
    font-weight:bold;
}

.final-box{
    background:#d4efdf;
    padding:14px;
    border-radius:8px;
    margin-top:12px;
    border-left:5px solid #2ecc71;
}

</style>
</head>

<body>

<div class="container">

<div class="input-group">

<label>Ürünün Fiyatı (TL)</label>

<div class="field-container">
<input 
type="text"
id="fiyat"
inputmode="decimal"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
>
<div 
class="clear-btn"
ontouchstart="temizleKutu(event,'fiyat')"
onclick="temizleKutu(event,'fiyat')"
>×</div>
</div>

</div>

<div class="input-group">

<label>Ürünün Gramajı (KG - LT)</label>

<div class="field-container">
<input 
type="text"
id="gramaj"
class="yellow-bg"
placeholder="Örn: 0,051"
inputmode="decimal"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
>
<div 
class="clear-btn"
ontouchstart="temizleKutu(event,'gramaj')"
onclick="temizleKutu(event,'gramaj')"
>×</div>
</div>

</div>

<button onclick="kgFiyatHesapla()">
KG - LT Fiyatını Hesapla
</button>

<div class="result" id="sonucAlani">

<p>
Ürün Fiyatı
<span class="highlight" id="resFiyat">0,00 TL</span>
</p>

<p>
Ürün Gramajı
<span class="highlight" id="resGramaj">0,000 KG</span>
</p>

<div class="final-box">

<p style="font-size:17px;font-weight:bold;color:#27ae60;">
1 KG Fiyatı
<span class="highlight" id="resKg">0,00 TL</span>
</p>

</div>

</div>

</div>

<script>

let aktifInput = null;

document.querySelectorAll("input").forEach(function(input){

    input.addEventListener("focus", function(){
        aktifInput = this;
    });

});

function temizleKutu(event,id){

    event.preventDefault();

    let input = document.getElementById(id);

    input.value = "";

    setTimeout(function(){

        input.focus();

    },10);

}

function sayiyaCevir(id){

    let value = document.getElementById(id).value.trim();

    if(value === ""){
        return 0;
    }

    value = value.replace(/\./g,"").replace(",",".");

    let sayi = parseFloat(value);

    return isNaN(sayi) ? 0 : sayi;
}

function kgFiyatHesapla(){

    let fiyat = sayiyaCevir("fiyat");
    let gramaj = sayiyaCevir("gramaj");

    if(fiyat <= 0){

        alert("Lütfen geçerli bir fiyat giriniz.");
        return;

    }

    if(gramaj <= 0){

        alert("Lütfen geçerli bir KG değeri giriniz.");
        return;

    }

    let kgFiyati = fiyat / gramaj;

    let fmt2 = {
        minimumFractionDigits:2,
        maximumFractionDigits:2
    };

    let fmt3 = {
        minimumFractionDigits:3,
        maximumFractionDigits:3
    };

    document.getElementById("resFiyat").innerText =
        fiyat.toLocaleString("tr-TR",fmt2) + " TL";

    document.getElementById("resGramaj").innerText =
        gramaj.toLocaleString("tr-TR",fmt3) + " KG";

    document.getElementById("resKg").innerText =
        kgFiyati.toLocaleString("tr-TR",fmt2) + " TL";

    document.getElementById("sonucAlani").style.display = "block";

}

document.querySelectorAll("input").forEach(function(input){

    input.addEventListener("keydown",function(e){

        if(e.key === "Enter"){

            e.preventDefault();
            kgFiyatHesapla();

        }

    });

});

</script>

</body>
</html>
