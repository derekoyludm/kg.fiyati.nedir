<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KG - LT Fiyat Hesaplama</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:20px;
    background:#eef2f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:470px;
    background:#fff;
    border-radius:18px;
    padding:26px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:700;
    color:#3d4f66;
}

.field-container{
    display:flex;
    align-items:center;
    gap:8px;
}

input{
    flex:1;
    height:46px;
    border:1.5px solid #c9d2dc;
    border-radius:8px;
    background:#fff;
    padding:0 14px;
    font-size:16px;
    text-align:center;
    transition:.15s;
}

input:focus{
    outline:none;
    border-color:#8fd4ae;
    box-shadow:0 0 0 4px rgba(143,212,174,0.35);
}

.clear-btn{
    width:40px;
    height:46px;
    background:#3498db;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.button-row{
    display:flex;
    gap:10px;
    margin-top:10px;
}

button{
    width:100%;
    height:50px;
    border-radius:8px;
    border:1.5px solid #c9d2dc;
    background:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
    color:#2c3e50;
}

/* ❌ default focus çerçevesi tamamen kapalı */
button:focus{
    outline:none;
    box-shadow:none;
}

/* ✔ sadece klavye ile gelince yeşil stil */
button:focus-visible{
    outline:none;
    border-color:#8fd4ae;
    box-shadow:0 0 0 4px rgba(143,212,174,0.45);
}

button:hover{
    background:#f6f8fa;
}

.reset-btn.active-reset{
    border-color:#e74c3c;
    box-shadow:0 0 0 4px rgba(231,76,60,0.35);
}

button.clicked-blue{
    border-color:#8fd4ae !important;
    box-shadow:0 0 0 4px rgba(143,212,174,0.45) !important;
}

.result{
    display:none;
    margin-top:20px;
    background:#ecfdf5;
    border-radius:10px;
    padding:18px;
}

.highlight{
    float:right;
    font-weight:bold;
}

.final-box{
    background:#d4efdf;
    padding:14px;
    border-radius:8px;
    margin-top:12px;
    border-left:5px solid #2ecc71;
}

</style>
</head>

<body>

<div class="container">

<div class="input-group">
<label>Fiyat</label>
<div class="field-container">
<input id="fiyat" type="text">
<div class="clear-btn" onclick="temizle('fiyat')">×</div>
</div>
</div>

<div class="input-group">
<label>Gramaj</label>
<div class="field-container">
<input id="gramaj" type="text">
<div class="clear-btn" onclick="temizle('gramaj')">×</div>
</div>
</div>

<div class="button-row">

<button id="hesaplaBtn" onclick="hesapla()">
Hesapla
</button>

<button id="resetBtn" class="reset-btn" onclick="sifirla(event)">
↺
</button>

</div>

<div class="result" id="sonuc">
<p>Fiyat <span class="highlight" id="resFiyat"></span></p>
<p>Gramaj <span class="highlight" id="resGramaj"></span></p>

<div class="final-box">
<p style="font-size:17px;font-weight:bold;color:#27ae60;">
KG Fiyatı
<span class="highlight" id="resKg"></span>
</p>
</div>

</div>

</div>

<script>

function sayi(id){
    let v=document.getElementById(id).value.trim();
    if(!v) return 0;
    return parseFloat(v.replace(/\./g,"").replace(",",".")) || 0;
}

function sifirla(e){

    e.preventDefault();

    document.querySelectorAll("input").forEach(i=>i.value="");

    document.getElementById("resetBtn")
        .classList.add("active-reset");

    document.getElementById("sonuc").style.display="none";
    document.getElementById("hesaplaBtn").classList.remove("clicked-blue");
}

function resetKapat(){
    document.getElementById("resetBtn")
        .classList.remove("active-reset");
}

function hesapla(){

    let fiyat=sayi("fiyat");
    let gramaj=sayi("gramaj");

    if(fiyat<=0 || gramaj<=0) return;

    let kg=fiyat/gramaj;

    document.getElementById("resFiyat").innerText=fiyat.toFixed(2)+" TL";
    document.getElementById("resGramaj").innerText=gramaj.toFixed(3);
    document.getElementById("resKg").innerText=kg.toFixed(2)+" TL";

    document.getElementById("sonuc").style.display="block";

    document.getElementById("hesaplaBtn")
        .classList.add("clicked-blue");
}

/* INPUT DEĞİŞİNCE RESET */
document.querySelectorAll("input").forEach(i=>{
    i.addEventListener("input", ()=>{

        resetKapat();

        document.getElementById("hesaplaBtn")
            .classList.remove("clicked-blue");

        document.getElementById("sonuc").style.display="none";
    });
});

/* ENTER İLE GEÇİŞ */
document.querySelectorAll("input").forEach((input, index, list) => {
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();

            let next = list[index + 1];

            if (next) {
                next.focus();
                next.select();
            } else {
                document.getElementById("hesaplaBtn").focus();
            }
        }
    });
});

/* CLEAR */
function temizle(id){

    document.getElementById(id).value="";

    resetKapat();

    document.getElementById("hesaplaBtn")
        .classList.remove("clicked-blue");

    document.getElementById("sonuc").style.display="none";

    setTimeout(()=>{
        document.getElementById(id).focus();
        document.getElementById(id).select();
    },10);
}

</script>

</body>
</html>
